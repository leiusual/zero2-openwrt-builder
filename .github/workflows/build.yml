name: Build Zero2

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: zero2-build
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check build inputs
        run: |
          bash -n scripts/prepare.sh
          sh -n files/etc/uci-defaults/99-zero2-defaults
          python3 -m py_compile scripts/check_image.py tests/test_defaults.py
          git diff --check
          (cd patches && sha256sum -c SHA256SUMS)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ \
            gawk gcc-multilib gettext git libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            libgnutls28-dev python3 python3-dev python3-setuptools python3-pyelftools \
            swig rsync wget curl unzip file pkg-config time bc cpio bzip2 xz-utils zstd \
            lz4 cmake ninja-build autoconf automake libtool qemu-user-static proot squashfs-tools
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Prepare official source and Zero2 adaptation
        run: |
          mkdir -p artifacts/logs
          bash scripts/prepare.sh 2>&1 | tee artifacts/logs/prepare.log
      - name: Download sources
        working-directory: work/openwrt
        run: make download -j8 2>&1 | tee ../../artifacts/logs/download.log
      - name: Build firmware
        working-directory: work/openwrt
        run: |
          make -j"$(nproc)" 2>&1 | tee ../../artifacts/logs/build.log || \
            make -j1 V=s 2>&1 | tee ../../artifacts/logs/build-retry.log
      - name: Verify firmware and default configuration
        working-directory: work/openwrt/bin/targets/rockchip/armv8
        run: |
          image=openwrt-rockchip-armv8-friendlyarm_nanopi-zero2-squashfs-sysupgrade.img.gz
          sha256sum --check --ignore-missing sha256sums
          for package in kmod-rtw88-8822ce rtl8822ce-firmware wpad-basic-mbedtls \
            luci-ssl luci-proto-wireguard wireguard-tools kmod-wireguard bind-dig; do
            grep -Eq "^${package} - " *.manifest
          done
          python3 "$GITHUB_WORKSPACE/scripts/check_image.py" \
            "$GITHUB_WORKSPACE/work/openwrt" "$image" \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/validation.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero2-build-logs
          path: artifacts/logs/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: zero2-sd-image
          path: |
            work/openwrt/bin/targets/rockchip/armv8/*.img.gz
            work/openwrt/bin/targets/rockchip/armv8/*.manifest
            work/openwrt/bin/targets/rockchip/armv8/*.buildinfo
            work/openwrt/bin/targets/rockchip/armv8/profiles.json
            work/openwrt/bin/targets/rockchip/armv8/sha256sums
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
